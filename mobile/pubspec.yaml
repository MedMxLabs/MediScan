name: medscan_mobile
description: MedMx LABS — medicine price comparison and health management for India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0
  provider: ^6.1.5
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  geolocator: ^14.0.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.9.0
  flutter_local_notifications: ^19.0.0
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/google_fonts/
